<body class="bg-slate-900 text-white antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- LUCIDE ICON WRAPPER FOR STANDALONE HTML ---
    const LucideIcon = ({ name, size = 20, className = "" }) => {
      const iconRef = React.useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          i.style.width = `${size}px`;
          i.style.height = `${size}px`;
          if (className) i.setAttribute('class', className);
          iconRef.current.appendChild(i);
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, size, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0" />;
    };

    const Users = (p) => <LucideIcon name="users" {...p} />;
    const DollarSign = (p) => <LucideIcon name="dollar-sign" {...p} />;
    const Activity = (p) => <LucideIcon name="activity" {...p} />;
    const History = (p) => <LucideIcon name="history" {...p} />;
    const LogOut = (p) => <LucideIcon name="log-out" {...p} />;
    const Check = (p) => <LucideIcon name="check" {...p} />;
    const X = (p) => <LucideIcon name="x" {...p} />;
    const Copy = (p) => <LucideIcon name="copy" {...p} />;
    const Eye = (p) => <LucideIcon name="eye" {...p} />;
    const EyeOff = (p) => <LucideIcon name="eye-off" {...p} />;
    const Settings = (p) => <LucideIcon name="settings" {...p} />;
    const Network = (p) => <LucideIcon name="network" {...p} />;
    const Trash2 = (p) => <LucideIcon name="trash-2" {...p} />;
    const Edit = (p) => <LucideIcon name="edit" {...p} />;
    const Save = (p) => <LucideIcon name="save" {...p} />;
    const Shield = (p) => <LucideIcon name="shield" {...p} />;
    const Download = (p) => <LucideIcon name="download" {...p} />;
    const Calendar = (p) => <LucideIcon name="calendar" {...p} />;
    const RotateCcw = (p) => <LucideIcon name="rotate-ccw" {...p} />;

    // --- UTILITY HELPERS ---
    const parseFlexibleDate = (dateStr) => {
      if (!dateStr) return null;
      const str = String(dateStr).trim();
      const isoMatch = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (isoMatch) {
        const d = new Date(Number(isoMatch[1]), Number(isoMatch[2]) - 1, Number(isoMatch[3]), 12, 0, 0, 0);
        return isNaN(d.getTime()) ? null : d;
      }
      const dmyMatch = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (dmyMatch && Number(dmyMatch[1]) > 12) {
        const d = new Date(Number(dmyMatch[3]), Number(dmyMatch[2]) - 1, Number(dmyMatch[1]), 12, 0, 0, 0);
        return isNaN(d.getTime()) ? null : d;
      }
      const parsed = new Date(str);
      if (isNaN(parsed.getTime())) return null;
      return new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate(), 12, 0, 0, 0);
    };

    const isWithinDateRange = (dateStr, startDate, endDate) => {
      if (!startDate && !endDate) return true;
      if (!dateStr) return true;
      const parsed = parseFlexibleDate(dateStr);
      if (!parsed) return true;
      if (startDate) {
        const start = parseFlexibleDate(startDate);
        if (start) {
          start.setHours(0, 0, 0, 0);
          if (parsed < start) return false;
        }
      }
      if (endDate) {
        const end = parseFlexibleDate(endDate);
        if (end) {
          end.setHours(23, 59, 59, 999);
          if (parsed > end) return false;
        }
      }
      return true;
    };

    const printPdfReport = (title, bodyHtml) => {
      const printWindow = window.open('', '_blank', 'width=950,height=750');
      if (!printWindow) return;
      printWindow.document.write(`
        <!DOCTYPE html>

              .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
              .card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; background: #f8fafc; }
              .card-label { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 700; }
              .card-val { font-size: 16px; font-weight: 800; margin-top: 4px; color: #0f172a; }
              table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
              th { background: #1e293b; color: #ffffff; text-align: left; padding: 9px 10px; font-weight: 600; }
              td { border-bottom: 1px solid #e2e8f0; padding: 8px 10px; }
              tr:nth-child(even) td { background: #f8fafc; }
              @media print { body { padding: 12px; } }
            </style>
          </head>
          <body>
            <div class="header">
              <div>
                <div class="brand">NexusCap Platform</div>
                <div style="font-size: 13px; color: #334155; margin-top: 2px;">${title}</div>
              </div>
              <div class="meta">
                Generated: ${new Date().toLocaleString()}<br/>
                Official System Statement
              </div>
            </div>
            ${bodyHtml}
            <script>
              window.onload = function() {
                window.print();
              };
            <\/script>
          </body>
        </html>
      `);
      printWindow.document.close();
    };

    const copyTextToClipboard = (text) => {
      try {
        const tempInput = document.createElement('input');
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
      } catch (err) {}
    };

    const getTodayInputDate = () => {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const formatDateInputForDisplay = (dateInputVal) => {
      if (!dateInputVal) return new Date().toLocaleDateString();
      const parsed = parseFlexibleDate(dateInputVal);
      return parsed ? parsed.toLocaleDateString() : dateInputVal;
    };

    const toDateInputValue = (storedDateStr) => {
      if (!storedDateStr) return getTodayInputDate();
      if (/^\d{4}-\d{2}-\d{2}$/.test(String(storedDateStr).trim())) return String(storedDateStr).trim();
      const parsed = parseFlexibleDate(storedDateStr);
      if (!parsed) return getTodayInputDate();
      const y = parsed.getFullYear();
      const m = String(parsed.getMonth() + 1).padStart(2, '0');
      const d = String(parsed.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    // --- SHARED DATE FILTER BAR ---
    const DateFilterBar = ({ startDate, endDate, setStartDate, setEndDate }) => (
      <div className="bg-slate-800/80 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row items-stretch sm:items-end gap-3">
        <div className="flex-1">
          <label className="text-xs text-slate-400 font-semibold uppercase mb-1 flex items-center gap-1.5">
            <Calendar size={13} className="text-blue-400" /> Start Date
          </label>
          <input
            type="date"
            value={startDate}
            onChange={(e) => setStartDate(e.target.value)}
            className="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white outline-none focus:border-blue-500"
          />
        </div>
        <div className="flex-1">
          <label className="text-xs text-slate-400 font-semibold uppercase mb-1 flex items-center gap-1.5">
            <Calendar size={13} className="text-blue-400" /> End Date
          </label>
          <input
            type="date"
            value={endDate}
            onChange={(e) => setEndDate(e.target.value)}
            className="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white outline-none focus:border-blue-500"
          />
        </div>
        {(startDate || endDate) && (
          <button
            type="button"
            onClick={() => { setStartDate(''); setEndDate(''); }}
            className="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors"
          >
            Clear Filter
          </button>
        )}
      </div>
    );

    // --- LOGIN & REGISTER SCREEN ---
    const LoginScreen = ({ onLogin, onRegister }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [phone, setPhone] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [formMsg, setFormMsg] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        setFormMsg('');
        if (isLogin) {
          const err = onLogin(phone, password);
          if (err) setFormMsg(err);
        } else {
          if (!name.trim() || !phone.trim() || !password.trim()) {
            setFormMsg('Please fill all fields');
            return;
          }
          const err = onRegister(name, phone, password);
          if (err) {
            setFormMsg(err);
          } else {
            setIsLogin(true);
            setFormMsg('Account created! Please sign in.');
          }
        }
      };

      return (
        <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 text-white">
          <form onSubmit={handleSubmit} className="bg-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl border border-slate-700 space-y-5">
            <div className="text-center mb-4">
              <div className="bg-blue-500/20 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                <Activity className="w-8 h-8 text-blue-400" />
              </div>
              <h1 className="text-2xl font-bold">NexusCap Platform</h1>
              <p className="text-slate-400 text-sm mt-1">{isLogin ? 'Sign in to your account' : 'Register a new investor account'}</p>
            </div>

            {formMsg && (
              <div className="bg-blue-500/15 border border-blue-500/40 text-blue-200 text-xs p-3 rounded-lg text-center">
                {formMsg}
              </div>
            )}

            <div className="space-y-4">
              {!isLogin && (
                <input
                  type="text"
                  placeholder="Full Name"
                  className="w-full bg-slate-700 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                />
              )}
              <input
                type="text"
                placeholder="Phone Number (User ID)"
                className="w-full bg-slate-700 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                value={phone}
                onChange={(e) => setPhone(e.target.value)}
              />
              <div className="relative">
                <input
                  type={showPassword ? 'text' : 'password'}
                  placeholder="Password"
                  className="w-full bg-slate-700 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none pr-10"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                />
                <button
                  type="button"
                  onClick={() => setShowPassword(!showPassword)}
                  className="absolute right-3 top-3.5 text-slate-400 hover:text-white"
                >
                  {showPassword ? <EyeOff size={20} /> : <Eye size={20} />}
                </button>
              </div>
              <button
                type="submit"
                className="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-semibold transition-colors"
              >
                {isLogin ? 'Sign In' : 'Create Account'}
              </button>
              <p
                className="text-center text-slate-400 text-sm pt-2 cursor-pointer hover:text-white"
                onClick={() => { setIsLogin(!isLogin); setFormMsg(''); }}
              >
                {isLogin ? "Don't have an account? Register" : 'Already have an account? Login'}
              </p>
            </div>
          </form>
        </div>
      );
    };

    // --- ADMIN OVERVIEW DASHBOARD ---
    const AdminDashboard = ({ users, transactions, profitHistory = [] }) => {
      const investors = users.filter((u) => u.role === 'investor');
      const pendingDeposits = transactions.filter((t) => t.type === 'Deposit' && t.status === 'Pending');
      const pendingWithdrawals = transactions.filter((t) => t.type === 'Withdrawal' && t.status === 'Pending');

      const totalBalances = investors.reduce((sum, u) => sum + (Number(u.balance) || 0), 0);
      const pendingWithdrawalsTotal = pendingWithdrawals.reduce((sum, w) => sum + Number(w.amount), 0);
      const pendingDepositsTotal = pendingDeposits.reduce((sum, d) => sum + Number(d.amount), 0);

      const activeTradingInvestors = investors.filter((u) => u.tradingActive);
      const activeTradingCapital = activeTradingInvestors.reduce((sum, u) => {
        const userPendingW = pendingWithdrawals
          .filter((w) => w.userId === u.phone)
          .reduce((wSum, w) => wSum + Number(w.amount), 0);
        const available = (Number(u.balance) || 0) - userPendingW;
        return sum + (available > 0 ? available : 0);
      }, 0);

      const lockedNotTradingInvestors = investors.filter((u) => !u.tradingActive);
      const lockedNotTradingCapital = lockedNotTradingInvestors.reduce((sum, u) => {
        const userPendingW = pendingWithdrawals
          .filter((w) => w.userId === u.phone)
          .reduce((wSum, w) => wSum + Number(w.amount), 0);
        const available = (Number(u.balance) || 0) - userPendingW;
        return sum + (available > 0 ? available : 0);
      }, 0);

      const todayInput = getTodayInputDate();
      const todaysBatches = profitHistory.filter(
        (record) => (record.rawDate || toDateInputValue(record.date)) === todayInput
      );
      const todaysProfitTotal = todaysBatches.reduce((sum, r) => sum + Number(r.amount || 0), 0);
      const capitalBaseBeforeTodaysProfit = activeTradingCapital - todaysProfitTotal;
      const effectiveBase = capitalBaseBeforeTodaysProfit > 0 ? capitalBaseBeforeTodaysProfit : activeTradingCapital;
      const todaysProfitPercent =
        todaysBatches.length > 0 && effectiveBase > 0 ? (todaysProfitTotal / effectiveBase) * 100 : 0;

      return (
        <div className="p-4 sm:p-6 max-w-6xl mx-auto space-y-6">
          <h2 className="text-2xl font-bold">System Overview</h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 flex justify-between items-start">
              <div>
                <p className="text-slate-400 text-sm mb-1">Total Investor Balances</p>
                <h3 className="text-2xl font-bold">${totalBalances.toFixed(2)}</h3>
                <span className="inline-block mt-2 px-2 py-0.5 rounded text-xs bg-blue-500/20 text-blue-400">{investors.length} Investors</span>
              </div>
              <div className="bg-blue-500/20 p-3 rounded-lg"><DollarSign className="w-6 h-6 text-blue-400" /></div>
            </div>

            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 flex justify-between items-start">
              <div>
                <p className="text-slate-400 text-sm mb-1">Pending Withdrawals</p>
                <h3 className="text-2xl font-bold">${pendingWithdrawalsTotal.toFixed(2)}</h3>
                <span className="inline-block mt-2 px-2 py-0.5 rounded text-xs bg-orange-500/20 text-orange-400">{pendingWithdrawals.length} Requests</span>
              </div>
              <div className="bg-orange-500/20 p-3 rounded-lg"><Activity className="w-6 h-6 text-orange-400" /></div>
            </div>

            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 flex justify-between items-start">
              <div>
                <p className="text-slate-400 text-sm mb-1">Pending Deposits</p>
                <h3 className="text-2xl font-bold">${pendingDepositsTotal.toFixed(2)}</h3>
                <span className="inline-block mt-2 px-2 py-0.5 rounded text-xs bg-yellow-500/20 text-yellow-400">{pendingDeposits.length} Requests</span>
              </div>
              <div className="bg-yellow-500/20 p-3 rounded-lg"><DollarSign className="w-6 h-6 text-yellow-400" /></div>
            </div>

            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 flex justify-between items-start">
              <div>
                <p className="text-slate-400 text-sm mb-1">Active Trading Capital</p>
                <h3 className="text-2xl font-bold">${activeTradingCapital.toFixed(2)}</h3>
                <span className="inline-block mt-2 px-2 py-0.5 rounded text-xs bg-green-500/20 text-green-400">{activeTradingInvestors.length} Investors (Trading ON)</span>
              </div>
              <div className="bg-green-500/20 p-3 rounded-lg"><Activity className="w-6 h-6 text-green-400" /></div>
            </div>

            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 flex justify-between items-start">
              <div>
                <p className="text-slate-400 text-sm mb-1">Locked Amount (Not Trading)</p>
                <h3 className="text-2xl font-bold">${lockedNotTradingCapital.toFixed(2)}</h3>
                <span className="inline-block mt-2 px-2 py-0.5 rounded text-xs bg-red-500/20 text-red-400">{lockedNotTradingInvestors.length} Investors (Trading OFF)</span>
              </div>
              <div className="bg-purple-500/20 p-3 rounded-lg"><Users className="w-6 h-6 text-purple-400" /></div>
            </div>

            {todaysBatches.length > 0 && (
              <div className="bg-slate-800 p-6 rounded-xl border border-emerald-500/40 flex justify-between items-start">
                <div>
                  <p className="text-slate-400 text-sm mb-1">Today's Profit Distributed</p>
                  <h3 className="text-2xl font-bold text-emerald-400">{todaysProfitPercent.toFixed(2)}%</h3>
                  <span className="inline-block mt-2 px-2 py-0.5 rounded text-xs bg-emerald-500/20 text-emerald-300">
                    ${todaysProfitTotal.toFixed(2)} ({todaysBatches.length} {todaysBatches.length === 1 ? 'Batch' : 'Batches'} Today)
                  </span>
                </div>
                <div className="bg-emerald-500/20 p-3 rounded-lg"><Activity className="w-6 h-6 text-emerald-400" /></div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- ADMIN INVESTORS MANAGEMENT ---
    const AdminUsers = ({ users, setUsers, transactions, setTransactions, deletedUsers, setDeletedUsers }) => {
      const [newPhone, setNewPhone] = useState('');
      const [newName, setNewName] = useState('');
      const [newPass, setNewPass] = useState('');
      const [newJoinedDate, setNewJoinedDate] = useState(getTodayInputDate());
      const [formMsg, setFormMsg] = useState('');

      const [editingPhone, setEditingPhone] = useState(null);
      const [editForm, setEditForm] = useState({
        name: '',
        phone: '',
        password: '',
        referrer: '',
        tradingActive: false,
        joinedDate: getTodayInputDate()
      });
      const [adjustAmount, setAdjustAmount] = useState('');
      const [adjustType, setAdjustType] = useState('add');
      const [adjustHashOrAddress, setAdjustHashOrAddress] = useState('');
      const [editMsg, setEditMsg] = useState('');

      const [deletingPhone, setDeletingPhone] = useState(null);

      const [filterStartDate, setFilterStartDate] = useState('');
      const [filterEndDate, setFilterEndDate] = useState('');

      const addUser = () => {
        setFormMsg('');
        if (!newPhone.trim() || !newName.trim() || !newPass.trim()) {
          setFormMsg('Please fill all fields.');
          return;
        }
        if (users.find((u) => u.phone === newPhone.trim())) {
          setFormMsg('Phone number already exists.');
          return;
        }
        setUsers([
          ...users,
          {
            phone: newPhone.trim(),
            name: newName.trim(),
            password: newPass,
            role: 'investor',
            balance: 0,
            tradingActive: false,
            referrer: null,
            joinedDate: newJoinedDate || getTodayInputDate()
          }
        ]);
        setNewPhone('');
        setNewName('');
        setNewPass('');
        setNewJoinedDate(getTodayInputDate());
      };

      const handleOpenEdit = (u) => {
        if (editingPhone === u.phone) {
          setEditingPhone(null);
          return;
        }
        setDeletingPhone(null);
        setEditingPhone(u.phone);
        setEditForm({
          name: u.name,
          phone: u.phone,
          password: u.password,
          referrer: u.referrer || '',
          tradingActive: u.tradingActive,
          joinedDate: toDateInputValue(u.joinedDate)
        });
        setAdjustAmount('');
        setAdjustType('add');
        setAdjustHashOrAddress('');
        setEditMsg('');
      };

      const handleSaveEdit = (originalPhone) => {
        setEditMsg('');
        if (!editForm.name.trim() || !editForm.phone.trim() || !editForm.password.trim()) {
          setEditMsg('Name, Phone, and Password are required.');
          return;
        }

        let updatedUsers = [...users];
        const targetIndex = updatedUsers.findIndex((u) => u.phone === originalPhone);
        if (targetIndex === -1) return;

        const cleanNewPhone = editForm.phone.trim();
        if (originalPhone !== cleanNewPhone && updatedUsers.find((u) => u.phone === cleanNewPhone)) {
          setEditMsg('Phone number already in use by another user.');
          return;
        }

        const numAmount = Number(adjustAmount);
        if (numAmount > 0 && adjustType === 'deduct') {
          if (!adjustHashOrAddress.trim().startsWith('0x') || adjustHashOrAddress.trim().length < 42) {
            setEditMsg('Valid BEP20 wallet address (0x...) required for deduction request.');
            return;
          }
        }

        updatedUsers[targetIndex] = {
          ...updatedUsers[targetIndex],
          name: editForm.name.trim(),
          phone: cleanNewPhone,
          password: editForm.password,
          referrer: editForm.referrer ? editForm.referrer.trim() : null,
          tradingActive: editForm.tradingActive,
          joinedDate: editForm.joinedDate || updatedUsers[targetIndex].joinedDate || getTodayInputDate()
        };

        if (originalPhone !== cleanNewPhone) {
          updatedUsers = updatedUsers.map((u) =>
            u.referrer === originalPhone ? { ...u, referrer: cleanNewPhone } : u
          );
          setTransactions((prev) =>
            prev.map((t) => (t.userId === originalPhone ? { ...t, userId: cleanNewPhone } : t))
          );
        }

        if (numAmount > 0) {

            setTransactions((prev) => [
              ...prev,
              {
                id: Date.now(),
                userId: cleanNewPhone,
                type: 'Deposit',
                amount: numAmount,
                status: 'Pending',
                date: new Date().toLocaleString(),
                hash: adjustHashOrAddress.trim() || 'Admin-Direct-Credit'

              ...prev,
              {
                id: Date.now(),
                userId: cleanNewPhone,
                type: 'Withdrawal',
                amount: numAmount,
                status: 'Pending',
                date: new Date().toLocaleString(),
                address: adjustHashOrAddress.trim()

          .filter((t) => t.type === 'Deposit')

        const totalWithdrawals = userTxns
          .filter((t) => t.type === 'Withdrawal')
          .reduce((sum, t) => sum + Number(t.amount), 0);
