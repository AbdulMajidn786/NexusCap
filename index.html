                <Trash2 size={20} /> Deleted Users (Trash)
              </h3>
              <div className="space-y-3">
                {deletedUsers.map((du, index) => (
                  <div
                    key={index}
                    className="bg-slate-900 p-3 rounded-lg flex justify-between items-center border border-slate-700"
                  >
                    <div>
                      <p className="font-bold text-white">
                        {du.name} <span className="text-slate-400 text-xs font-normal">({du.phone})</span>
                      </p>
                      <p className="text-xs text-slate-500">Balance: ${Number(du.balance).toFixed(2)}</p>
                    </div>
                    <button
                      type="button"
                      onClick={() => restoreUser(du)}
                      className="bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors"
                    >
                      Restore User
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- ADMIN DEPOSITS & WITHDRAWALS ---
    const AdminTransactions = ({ type, transactions, setTransactions, users, setUsers }) => {
      const [payingTxnId, setPayingTxnId] = useState(null);
      const [completionHash, setCompletionHash] = useState('');
      const [payError, setPayError] = useState('');

      const [editingTxnId, setEditingTxnId] = useState(null);
      const [editTxnForm, setEditTxnForm] = useState({ amount: '', hash: '', address: '', status: 'Pending' });

      const [filterStartDate, setFilterStartDate] = useState('');
      const [filterEndDate, setFilterEndDate] = useState('');

      const filtered = transactions.filter(
        (t) => t.type === type && isWithinDateRange(t.date, filterStartDate, filterEndDate)
      );

      const approveTxn = (id, hashVal = '') => {
        const txns = transactions.map((t) => ({ ...t }));
        const usrs = users.map((u) => ({ ...u }));
        const txn = txns.find((t) => t.id === id);
        if (!txn) return;

        const usr = usrs.find((u) => u.phone === txn.userId);
        if (usr) {
          if (type === 'Deposit' && txn.status !== 'Completed') {
            usr.balance = Number(usr.balance) + Number(txn.amount);
          } else if (type === 'Withdrawal' && txn.status !== 'Completed') {
            usr.balance = Math.max(0, Number(usr.balance) - Number(txn.amount));
          }
        }

        txn.status = 'Completed';
        if (hashVal) txn.hash = hashVal;

        setTransactions(txns);
        setUsers(usrs);
        setPayingTxnId(null);
        setCompletionHash('');
        setPayError('');
      };

      const rejectTxn = (id) => {
        const txns = transactions.map((t) => ({ ...t }));
        const usrs = users.map((u) => ({ ...u }));
        const txn = txns.find((t) => t.id === id);
        if (!txn) return;

        if (txn.status === 'Completed') {
          const usr = usrs.find((u) => u.phone === txn.userId);
          if (usr) {
            if (type === 'Deposit') {
              usr.balance = Math.max(0, Number(usr.balance) - Number(txn.amount));
            } else if (type === 'Withdrawal') {
              usr.balance = Number(usr.balance) + Number(txn.amount);
            }
          }
        }

        txn.status = 'Rejected';
        setTransactions(txns);
        setUsers(usrs);
      };

      const startEditTxn = (t) => {
        if (editingTxnId === t.id) {
          setEditingTxnId(null);
          return;
        }
        setPayingTxnId(null);
        setEditingTxnId(t.id);
        setEditTxnForm({
          amount: String(t.amount),
          hash: t.hash || '',
          address: t.address || '',
          status: t.status
        });
      };

      const handleSaveEditTxn = (origTxn) => {
        const newAmt = Number(editTxnForm.amount);
        if (!newAmt || newAmt <= 0) return;

        const updatedUsers = users.map((u) => ({ ...u }));
        const targetUser = updatedUsers.find((u) => u.phone === origTxn.userId);

        if (targetUser) {
          if (type === 'Deposit') {
            if (origTxn.status === 'Completed' && editTxnForm.status !== 'Completed') {
              targetUser.balance = Math.max(0, Number(targetUser.balance) - Number(origTxn.amount));
            } else if (origTxn.status !== 'Completed' && editTxnForm.status === 'Completed') {
              targetUser.balance = Number(targetUser.balance) + newAmt;
            } else if (origTxn.status === 'Completed' && editTxnForm.status === 'Completed') {
              targetUser.balance = Math.max(0, Number(targetUser.balance) - Number(origTxn.amount) + newAmt);
            }
          } else if (type === 'Withdrawal') {
            if (origTxn.status === 'Completed' && editTxnForm.status !== 'Completed') {
              targetUser.balance = Number(targetUser.balance) + Number(origTxn.amount);
            } else if (origTxn.status !== 'Completed' && editTxnForm.status === 'Completed') {
              targetUser.balance = Math.max(0, Number(targetUser.balance) - newAmt);
            } else if (origTxn.status === 'Completed' && editTxnForm.status === 'Completed') {
              targetUser.balance = Math.max(0, Number(targetUser.balance) + Number(origTxn.amount) - newAmt);
            }
          }
        }

        const updatedTxns = transactions.map((t) =>
          t.id === origTxn.id
            ? {
                ...t,
                amount: newAmt,
                hash: editTxnForm.hash,
                address: editTxnForm.address,
                status: editTxnForm.status
              }
            : t
        );

        setUsers(updatedUsers);
        setTransactions(updatedTxns);
        setEditingTxnId(null);
      };

      const downloadTransactionsPdf = () => {
        const totalAmt = filtered.reduce((sum, t) => sum + Number(t.amount || 0), 0);
        const completedAmt = filtered
          .filter((t) => t.status === 'Completed')
          .reduce((sum, t) => sum + Number(t.amount || 0), 0);
        const pendingAmt = filtered
          .filter((t) => t.status === 'Pending')
          .reduce((sum, t) => sum + Number(t.amount || 0), 0);

        const rangeText =
          filterStartDate || filterEndDate
            ? `Date Range: ${filterStartDate || 'Beginning'} to ${filterEndDate || 'Present'}`
            : 'Date Range: All Time';

        const rowsHtml =
          filtered.length === 0
            ? `<tr><td colspan="6" style="text-align:center;">No ${type.toLowerCase()} records found.</td></tr>`
            : filtered
                .slice()
                .reverse()
                .map((t) => {
                  const usr = users.find((u) => u.phone === t.userId);
                  return `
                    <tr>
                      <td>${t.date}</td>
                      <td>${usr ? usr.name : 'Unknown'} (${t.userId})</td>
                      <td>$${Number(t.amount).toFixed(2)}</td>
                      <td>${t.status}</td>
                      <td style="font-family:monospace;font-size:11px;">${t.address || '-'}</td>
                      <td style="font-family:monospace;font-size:11px;">${t.hash || '-'}</td>
                    </tr>
                  `;
                })
                .join('');

        printPdfReport(
          `All ${type}s Report`,
          `
            <p style="font-size:12px;color:#475569;margin-bottom:14px;"><strong>${rangeText}</strong></p>
            <div class="summary-grid">
              <div class="card"><div class="card-label">Total Records</div><div class="card-val">${filtered.length}</div></div>
              <div class="card"><div class="card-label">Total ${type} Volume</div><div class="card-val">$${totalAmt.toFixed(2)}</div></div>
              <div class="card"><div class="card-label">Completed</div><div class="card-val">$${completedAmt.toFixed(2)}</div></div>
              <div class="card"><div class="card-label">Pending</div><div class="card-val">$${pendingAmt.toFixed(2)}</div></div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Date & Time</th>
                  <th>Investor</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Wallet Address</th>
                  <th>Tx Hash</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          `
        );
      };

      const renderInlinePayPanel = (t) => (
        <div className="bg-slate-900/95 p-4 rounded-xl border border-green-500/40 space-y-3">
          <div className="flex justify-between items-center border-b border-slate-700 pb-2">
            <h4 className="font-bold text-green-400 text-sm">
              Complete Withdrawal for {t.userId} (${Number(t.amount).toFixed(2)})
            </h4>
            <button
              type="button"
              onClick={() => {
                setPayingTxnId(null);
                setPayError('');
              }}
              className="text-slate-400 hover:text-white p-1"
            >
              <X size={16} />
            </button>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
            <div className="bg-slate-800 p-3 rounded-lg border border-slate-700">
              <span className="text-slate-400 block text-xs mb-1">Pay To BEP20 Address:</span>
              <div className="flex justify-between items-center gap-2">
                <span className="font-mono text-white text-xs break-all">{t.address}</span>
                <button
                  type="button"
                  onClick={() => copyTextToClipboard(t.address)}
                  className="bg-slate-700 p-1.5 rounded hover:bg-slate-600"
                >
                  <Copy size={14} />
                </button>
              </div>
            </div>
            <div>
              <label className="text-slate-400 block text-xs mb-1">Transaction Hash (TxID):</label>
              <input
                type="text"
                placeholder="0x..."
                value={completionHash}
                onChange={(e) => setCompletionHash(e.target.value)}
                className="w-full bg-slate-800 p-2.5 rounded-lg outline-none focus:ring-1 focus:ring-green-500 font-mono text-sm text-white border border-slate-700"
              />
            </div>
          </div>
          {payError && <p className="text-xs text-red-400">{payError}</p>}
          <div className="flex gap-3 justify-end">
            <button
              type="button"
              onClick={() => {
                setPayingTxnId(null);
                setPayError('');
              }}
              className="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-xs font-semibold text-white"
            >
              Cancel
            </button>
            <button
              type="button"
              onClick={() => {
                if (!completionHash.trim()) {
                  setPayError('Transaction hash is required.');
                  return;
                }
                const exists = transactions.find((item) => item.hash === completionHash.trim());
                if (exists) {
                  setPayError('Duplicate transaction hash found.');
                  return;
                }
                approveTxn(t.id, completionHash.trim());
              }}
              className="bg-green-600 hover:bg-green-700 px-5 py-2 rounded-lg text-xs font-semibold text-white"
            >
              Confirm & Complete
            </button>
          </div>
        </div>
      );

      const renderInlineEditTxnPanel = (t) => (
        <div className="bg-slate-900/95 p-4 rounded-xl border border-blue-500/40 space-y-3">
          <div className="flex justify-between items-center border-b border-slate-700 pb-2">
            <h4 className="font-bold text-blue-400 text-sm">
              Edit {type} ({t.userId})
            </h4>
            <button type="button" onClick={() => setEditingTxnId(null)} className="text-slate-400 hover:text-white p-1">
              <X size={16} />
            </button>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label className="text-xs text-slate-400 block mb-1">Amount ($)</label>
              <input
                type="number"
                value={editTxnForm.amount}
                onChange={(e) => setEditTxnForm({ ...editTxnForm, amount: e.target.value })}
                className="w-full bg-slate-800 p-2.5 rounded-lg text-white text-sm outline-none border border-slate-700"
              />
            </div>
            {type === 'Deposit' ? (
              <div>
                <label className="text-xs text-slate-400 block mb-1">Tx Hash</label>
                <input
                  type="text"
                  value={editTxnForm.hash}
                  onChange={(e) => setEditTxnForm({ ...editTxnForm, hash: e.target.value })}
                  className="w-full bg-slate-800 p-2.5 rounded-lg text-white font-mono text-sm outline-none border border-slate-700"
                />
              </div>
            ) : (
              <div>
                <label className="text-xs text-slate-400 block mb-1">Wallet Address</label>
                <input
                  type="text"
                  value={editTxnForm.address}
                  onChange={(e) => setEditTxnForm({ ...editTxnForm, address: e.target.value })}
                  className="w-full bg-slate-800 p-2.5 rounded-lg text-white font-mono text-sm outline-none border border-slate-700"
                />
              </div>
            )}
            <div>
              <label className="text-xs text-slate-400 block mb-1">Status</label>
              <select
                value={editTxnForm.status}
                onChange={(e) => setEditTxnForm({ ...editTxnForm, status: e.target.value })}
                className="w-full bg-slate-800 p-2.5 rounded-lg text-white text-sm outline-none border border-slate-700"
              >
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
                <option value="Rejected">Rejected</option>
              </select>
            </div>
          </div>
          <div className="flex gap-3 justify-end">
            <button
              type="button"
              onClick={() => setEditingTxnId(null)}
              className="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-xs font-semibold text-white"
            >
              Cancel
            </button>
            <button
              type="button"
              onClick={() => handleSaveEditTxn(t)}
              className="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-lg text-xs font-semibold text-white"
            >
              Save {type}
            </button>
          </div>
        </div>
      );

      return (
        <div className="p-4 sm:p-6 max-w-6xl mx-auto space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <h3 className="text-xl font-bold">Manage {type}s ({filtered.length})</h3>
            <button
              type="button"
              onClick={downloadTransactionsPdf}
              className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition-colors"
            >
              <Download size={16} /> Download All {type}s PDF
            </button>
          </div>

          <DateFilterBar
            startDate={filterStartDate}
            endDate={filterEndDate}
            setStartDate={setFilterStartDate}
            setEndDate={setFilterEndDate}
          />

          {/* Mobile Card View */}
          <div className="block sm:hidden space-y-4">
            {filtered
              .slice()
              .reverse()
              .map((t) => (
                <div key={t.id} className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                  <div className="flex justify-between items-center border-b border-slate-700 pb-2">
                    <span className="font-bold text-sm">{t.date}</span>
                    <span
                      className={`px-2 py-1 rounded text-xs ${
                        t.status === 'Completed'
                          ? 'bg-green-500/20 text-green-400'
                          : t.status === 'Pending'
                          ? 'bg-orange-500/20 text-orange-400'
                          : 'bg-red-500/20 text-red-400'
                      }`}
                    >
                      {t.status}
                    </span>
                  </div>
                  <div className="flex justify-between text-sm">
                    <span className="text-slate-400">User ID:</span>
                    <span>{t.userId}</span>
                  </div>
                  <div className="flex justify-between text-sm">
                    <span className="text-slate-400">Amount:</span>
                    <span className="font-bold text-green-400">${Number(t.amount).toFixed(2)}</span>
                  </div>
                  {type === 'Deposit' && (
                    <div className="text-sm">
                      <span className="text-slate-400 block mb-1">Tx Hash:</span>
                      <div className="bg-slate-900 p-2 rounded flex justify-between items-center">
                        <span className="font-mono text-xs truncate max-w-[200px]">{t.hash}</span>
                        <button type="button" onClick={() => copyTextToClipboard(t.hash)}>
                          <Copy size={14} className="text-slate-400" />
                        </button>
                      </div>
                    </div>
                  )}
                  {type === 'Withdrawal' && (
                    <div className="text-sm">
                      <span className="text-slate-400 block mb-1">Wallet Address:</span>
                      <div className="bg-slate-900 p-2 rounded flex justify-between items-center">
                        <span className="font-mono text-xs truncate max-w-[200px]">{t.address}</span>
                        <button type="button" onClick={() => copyTextToClipboard(t.address)}>
                          <Copy size={14} className="text-slate-400" />
                        </button>
                      </div>
                      {t.hash && <div className="mt-2 text-xs text-green-400 break-all">Tx: {t.hash}</div>}
                    </div>
                  )}

                  <div className="flex gap-2 pt-2 border-t border-slate-700">
                    <button
                      type="button"
                      onClick={() => startEditTxn(t)}
                      className="flex-1 bg-blue-500/20 text-blue-400 py-2 rounded-lg flex items-center justify-center gap-1 text-xs font-semibold"
                    >
                      <Edit size={14} /> Edit
                    </button>
                    {t.status === 'Pending' && (
                      <>
                        {type === 'Withdrawal' ? (
                          <button
                            type="button"
                            onClick={() => {
                              setEditingTxnId(null);
                              setPayingTxnId(payingTxnId === t.id ? null : t.id);
                              setCompletionHash('');
                              setPayError('');
                            }}
                            className="flex-1 bg-green-500/20 text-green-400 py-2 rounded-lg flex items-center justify-center gap-1 text-xs font-semibold"
                          >
                            <Check size={14} /> Pay
                          </button>
                        ) : (
                          <button
                            type="button"
                            onClick={() => approveTxn(t.id)}
                            className="flex-1 bg-green-500/20 text-green-400 py-2 rounded-lg flex items-center justify-center gap-1 text-xs font-semibold"
                          >
                            <Check size={14} /> Approve
                          </button>
                        )}
                        <button
                          type="button"
                          onClick={() => rejectTxn(t.id)}
                          className="flex-1 bg-red-500/20 text-red-400 py-2 rounded-lg flex items-center justify-center gap-1 text-xs font-semibold"
                        >
                          <X size={14} /> Reject
                        </button>
                      </>
                    )}
                  </div>

                  {payingTxnId === t.id && type === 'Withdrawal' && <div className="pt-2">{renderInlinePayPanel(t)}</div>}
                  {editingTxnId === t.id && <div className="pt-2">{renderInlineEditTxnPanel(t)}</div>}
                </div>
              ))}
          </div>

          {/* Desktop Table View */}
          <div className="hidden sm:block bg-slate-800 rounded-xl border border-slate-700 overflow-x-auto">
            <table className="w-full text-left">
              <thead className="bg-slate-900/50">
                <tr>
                  <th className="p-4">Date</th>
                  <th className="p-4">User ID</th>
                  <th className="p-4">Amount</th>
                  {type === 'Deposit' && <th className="p-4">Tx Hash</th>}
                  {type === 'Withdrawal' && <th className="p-4">Address & Hash</th>}
                  <th className="p-4">Status</th>
                  <th className="p-4">Action</th>
                </tr>
              </thead>
              <tbody>
                {filtered
                  .slice()
                  .reverse()
                  .map((t) => (
                    <React.Fragment key={t.id}>
                      <tr className="border-t border-slate-700">
                        <td className="p-4 text-sm">{t.date}</td>
                        <td className="p-4">{t.userId}</td>
                        <td className="p-4 font-mono text-green-400">${Number(t.amount).toFixed(2)}</td>

                        {type === 'Deposit' && (
                          <td className="p-4 max-w-[250px]">
                            <div className="flex items-center gap-2">
                              <span className="truncate font-mono text-sm">{t.hash}</span>
                              <button
                                type="button"
                                onClick={() => copyTextToClipboard(t.hash)}
                                className="text-slate-400 hover:text-white p-1 rounded bg-slate-700"
                              >
                                <Copy size={14} />
                              </button>
                            </div>
                          </td>
                        )}
                        {type === 'Withdrawal' && (
                          <td className="p-4 max-w-[250px]">
                            <div className="flex items-center gap-2 mb-1">
                              <span className="truncate font-mono text-sm">{t.address}</span>
                              <button
                                type="button"
                                onClick={() => copyTextToClipboard(t.address)}
                                className="text-slate-400 hover:text-white p-1 rounded bg-slate-700"
                              >
                                <Copy size={14} />
                              </button>
                            </div>
                            {t.hash && <div className="text-xs text-green-400 truncate break-all">Tx: {t.hash}</div>}
                          </td>
                        )}

                        <td className="p-4">
                          <span
                            className={`px-2 py-1 rounded text-xs ${
                              t.status === 'Completed'
                                ? 'bg-green-500/20 text-green-400'
                                : t.status === 'Pending'
                                ? 'bg-orange-500/20 text-orange-400'
                                : 'bg-red-500/20 text-red-400'
                            }`}
                          >
                            {t.status}
                          </span>
                        </td>
                        <td className="p-4 flex gap-2">
                          <button
                            type="button"
                            onClick={() => startEditTxn(t)}
                            className="p-2 bg-blue-500/20 text-blue-400 rounded hover:bg-blue-500/40"
                            title="Edit Transaction"
                          >
                            <Edit size={16} />
                          </button>
                          {t.status === 'Pending' && (
                            <>
                              {type === 'Withdrawal' ? (
                                <button
                                  type="button"
                                  onClick={() => {
                                    setEditingTxnId(null);
                                    setPayingTxnId(payingTxnId === t.id ? null : t.id);
                                    setCompletionHash('');
                                    setPayError('');
                                  }}
                                  className="p-2 bg-green-500/20 text-green-400 rounded hover:bg-green-500/40"
                                  title="Pay Withdrawal"
                                >
                                  <Check size={16} />
                                </button>
                              ) : (
                                <button
                                  type="button"
                                  onClick={() => approveTxn(t.id)}
                                  className="p-2 bg-green-500/20 text-green-400 rounded hover:bg-green-500/40"
                                  title="Approve Deposit"
                                >
                                  <Check size={16} />
                                </button>
                              )}
                              <button
                                type="button"
                                onClick={() => rejectTxn(t.id)}
                                className="p-2 bg-red-500/20 text-red-400 rounded hover:bg-red-500/40"
                                title="Reject"
                              >
                                <X size={16} />
                              </button>
                            </>
                          )}
                        </td>
                      </tr>

                      {payingTxnId === t.id && type === 'Withdrawal' && (
                        <tr className="bg-slate-900/60">
                          <td colSpan="6" className="p-4">
                            {renderInlinePayPanel(t)}
                          </td>
                        </tr>
                      )}

                      {editingTxnId === t.id && (
                        <tr className="bg-slate-900/60">
                          <td colSpan="6" className="p-4">
                            {renderInlineEditTxnPanel(t)}
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // --- ADMIN PROFIT DISTRIBUTION ---
    const AdminProfitDist = ({ users, setUsers, transactions, setTransactions, profitHistory, setProfitHistory }) => {
      const [amount, setAmount] = useState('');
      const [distDateInput, setDistDateInput] = useState(getTodayInputDate());
      const [distError, setDistError] = useState('');
      const [expandedBatchId, setExpandedBatchId] = useState(null);
      const [deletedProfitHistory, setDeletedProfitHistory] = useState([]);

      const [editingBatchId, setEditingBatchId] = useState(null);
      const [editBatchAmount, setEditBatchAmount] = useState('');
      const [editBatchDate, setEditBatchDate] = useState('');

      const [filterStartDate, setFilterStartDate] = useState('');
      const [filterEndDate, setFilterEndDate] = useState('');

      const distributePoolCalculations = (poolAmount, batchId, rawDateStr, displayDateStr, currentUsers, currentTransactions) => {
        const activeInvestors = currentUsers.filter((u) => u.role === 'investor' && u.tradingActive);
        let totalActiveBalance = 0;
        const traderBalances = [];

        activeInvestors.forEach((investor) => {
          const pendingW = currentTransactions
            .filter((t) => t.userId === investor.phone && t.type === 'Withdrawal' && t.status === 'Pending')
            .reduce((sum, w) => sum + Number(w.amount), 0);

          const activeBal = (Number(investor.balance) || 0) - pendingW;
          if (activeBal > 0) {
            totalActiveBalance += activeBal;
            traderBalances.push({ investor, activeBal });
          }
        });

        if (totalActiveBalance <= 0) return null;

        const updatedUsers = currentUsers.map((u) => ({ ...u }));
        const addedTxns = [];
        const batchDetails = [];
        let totalDist = 0;
        let totalDirect = 0;
        let totalRef = 0;

        traderBalances.forEach(({ investor: invObj, activeBal }) => {
          const investor = updatedUsers.find((u) => u.phone === invObj.phone);
          if (!investor) return;

          const investorTotalShare = (activeBal / totalActiveBalance) * poolAmount;
          const l1Share = investorTotalShare * (5 / 55);
          const l2Share = investorTotalShare * (3 / 55);
          const l3Share = investorTotalShare * (2 / 55);

          let actualRefPaid = 0;
          const l1User = investor.referrer ? updatedUsers.find((u) => u.phone === investor.referrer) : null;
          const l2User = l1User && l1User.referrer ? updatedUsers.find((u) => u.phone === l1User.referrer) : null;
          const l3User = l2User && l2User.referrer ? updatedUsers.find((u) => u.phone === l2User.referrer) : null;

          if (l1User) {
            actualRefPaid += l1Share;
            l1User.balance = Number(l1User.balance) + l1Share;
            addedTxns.push({
              id: Date.now() + Math.random(),
              userId: l1User.phone,
              type: `Referral Bonus (L1 from ${investor.name})`,
              amount: l1Share,
              rawDate: rawDateStr,
              date: displayDateStr,
              status: 'Completed',
              batchId
            });
          }
          if (l2User) {
            actualRefPaid += l2Share;
            l2User.balance = Number(l2User.balance) + l2Share;
            addedTxns.push({
              id: Date.now() + Math.random(),
              userId: l2User.phone,
              type: `Referral Bonus (L2 from ${investor.name})`,
              amount: l2Share,
              rawDate: rawDateStr,
              date: displayDateStr,
              status: 'Completed',
              batchId
            });
          }
          if (l3User) {
            actualRefPaid += l3Share;
            l3User.balance = Number(l3User.balance) + l3Share;
            addedTxns.push({
              id: Date.now() + Math.random(),
              userId: l3User.phone,
              type: `Referral Bonus (L3 from ${investor.name})`,
              amount: l3Share,
              rawDate: rawDateStr,
              date: displayDateStr,
              status: 'Completed',
              batchId
            });
          }

          const userShare = investorTotalShare - actualRefPaid;
          totalDirect += userShare;
          totalRef += actualRefPaid;
          totalDist += userShare + actualRefPaid;

          investor.balance = Number(investor.balance) + userShare;

          addedTxns.push({
            id: Date.now() + Math.random(),
            userId: investor.phone,
            type: 'Profit',
            amount: userShare,
            rawDate: rawDateStr,
            date: displayDateStr,
            status: 'Completed',
            batchId
          });

          batchDetails.push({
            name: investor.name,
            phone: investor.phone,
            directProfit: userShare,
            referralEarned: actualRefPaid
          });
        });

        return {
          updatedUsers,
          addedTxns,
          batchRecord: {
            id: batchId,
            rawDate: rawDateStr,
            date: displayDateStr,
            amount: totalDist,
            directProfit: totalDirect,
            referralBonus: totalRef,
            count: traderBalances.length,
            type: 'Profit + Referral Network',
            details: batchDetails
          }
        };
      };

      const handleDistribute = () => {
        setDistError('');
        const val = Number(amount);
        if (!val || val <= 0) {
          setDistError('Please enter a valid positive profit pool amount.');
          return;
        }

        const batchId = Date.now();
        const chosenRawDate = distDateInput || getTodayInputDate();
        const chosenDate = formatDateInputForDisplay(chosenRawDate);
        const result = distributePoolCalculations(val, batchId, chosenRawDate, chosenDate, users, transactions);
        if (!result) {
          setDistError('No active trading accounts with available balance found.');
          return;
        }

        setUsers(result.updatedUsers);
        setTransactions([...transactions, ...result.addedTxns]);
        setProfitHistory((prev) => [result.batchRecord, ...prev]);
        setAmount('');
      };

      const handleStartEditBatch = (record) => {
        setEditingBatchId(record.id);
        setEditBatchAmount(String(Number(record.amount).toFixed(2)));
        setEditBatchDate(record.rawDate || toDateInputValue(record.date));
      };

      const handleSaveEditBatch = (record) => {
        const newPoolVal = Number(editBatchAmount);
        if (!newPoolVal || newPoolVal <= 0) return;

        const batchTxns = transactions.filter((t) => t.batchId === record.id);
        const revertedUsers = users.map((u) => {
          const userCredit = batchTxns
            .filter((t) => t.userId === u.phone)
            .reduce((sum, t) => sum + Number(t.amount), 0);
          return { ...u, balance: Math.max(0, Number(u.balance) - userCredit) };
        });
        const remainingTxns = transactions.filter((t) => t.batchId !== record.id);

        const updatedRawDate = editBatchDate || record.rawDate || toDateInputValue(record.date);
        const updatedDateStr = editBatchDate ? formatDateInputForDisplay(editBatchDate) : record.date;
        const recalculated = distributePoolCalculations(
          newPoolVal,
          record.id,
          updatedRawDate,
          updatedDateStr,
          revertedUsers,
          remainingTxns
        );
        if (!recalculated) return;

        setUsers(recalculated.updatedUsers);
        setTransactions([...remainingTxns, ...recalculated.addedTxns]);
        setProfitHistory((prev) => prev.map((b) => (b.id === record.id ? recalculated.batchRecord : b)));
        setEditingBatchId(null);
      };

      const handleDeleteBatch = (record) => {
        const batchTxns = transactions.filter((t) => t.batchId === record.id);
        const revertedUsers = users.map((u) => {
          const userCredit = batchTxns
            .filter((t) => t.userId === u.phone)
            .reduce((sum, t) => sum + Number(t.amount), 0);
          return { ...u, balance: Math.max(0, Number(u.balance) - userCredit) };
        });

        setUsers(revertedUsers);
        setTransactions((prev) => prev.filter((t) => t.batchId !== record.id));
        setDeletedProfitHistory((prev) => [{ record, batchTxns }, ...prev]);
        setProfitHistory((prev) => prev.filter((b) => b.id !== record.id));
      };

      const handleRecoverBatch = (deletedItem) => {
        const { record, batchTxns } = deletedItem;
        const restoredUsers = users.map((u) => {
          const userCredit = batchTxns
            .filter((t) => t.userId === u.phone)
            .reduce((sum, t) => sum + Number(t.amount), 0);
          return { ...u, balance: Number(u.balance) + userCredit };
        });

        setUsers(restoredUsers);
        setTransactions((prev) => [...prev, ...batchTxns]);
        setProfitHistory((prev) => [record, ...prev]);
        setDeletedProfitHistory((prev) => prev.filter((d) => d.record.id !== record.id));
      };

      const filteredBatches = profitHistory.filter((record) =>
        isWithinDateRange(record.rawDate || record.date, filterStartDate, filterEndDate)
      );

      const downloadProfitHistoryPdf = () => {
        const totalPool = filteredBatches.reduce((sum, b) => sum + Number(b.amount || 0), 0);
        const totalDirect = filteredBatches.reduce((sum, b) => sum + Number(b.directProfit || 0), 0);
        const totalRef = filteredBatches.reduce((sum, b) => sum + Number(b.referralBonus || 0), 0);

        const rangeText =
          filterStartDate || filterEndDate
            ? `Date Range: ${filterStartDate || 'Beginning'} to ${filterEndDate || 'Present'}`
            : 'Date Range: All Time';

        const rowsHtml =
          filteredBatches.length === 0
            ? '<tr><td colspan="6" style="text-align:center;">No profit distribution batches found in selected date range.</td></tr>'
            : filteredBatches
                .map(
                  (record, idx) => `
                  <tr>
                    <td>Batch #${filteredBatches.length - idx}</td>
                    <td>${record.date}</td>
                    <td>$${Number(record.amount || 0).toFixed(2)}</td>
                    <td>$${Number(record.directProfit || 0).toFixed(2)}</td>
                    <td>$${Number(record.referralBonus || 0).toFixed(2)}</td>
                    <td>${record.count || (record.details ? record.details.length : 0)} Investors</td>
                  </tr>
                `
                )
                .join('');

        printPdfReport(
          'Profit & Referral Distribution History Report',
          `
            <p style="font-size:12px;color:#475569;margin-bottom:14px;"><strong>${rangeText}</strong></p>
            <div class="summary-grid">
              <div class="card"><div class="card-label">Total Batches</div><div class="card-val">${filteredBatches.length}</div></div>
              <div class="card"><div class="card-label">Total Pool Distributed</div><div class="card-val">$${totalPool.toFixed(2)}</div></div>
              <div class="card"><div class="card-label">Total Direct Profit</div><div class="card-val">$${totalDirect.toFixed(2)}</div></div>
              <div class="card"><div class="card-label">Total Referral Bonus</div><div class="card-val">$${totalRef.toFixed(2)}</div></div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Batch</th>
                  <th>Date & Time</th>
                  <th>Total Pool</th>
                  <th>Direct Profit</th>
                  <th>Referral Bonus</th>
                  <th>Credited Accounts</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          `
        );
      };

      const downloadSingleBatchPdf = (record, batchNumber) => {
        const detailsList = record.details || [];
        const rowsHtml =
          detailsList.length === 0
            ? '<tr><td colspan="5" style="text-align:center;">No individual payout records found for this batch.</td></tr>'
            : detailsList
                .map(
                  (det) => `
                  <tr>
                    <td><strong>${det.name}</strong></td>
                    <td style="font-family:monospace;">${det.phone}</td>
                    <td>$${Number(det.directProfit || 0).toFixed(2)}</td>
                    <td>$${Number(det.referralEarned || 0).toFixed(2)}</td>
                    <td><strong>$${(Number(det.directProfit || 0) + Number(det.referralEarned || 0)).toFixed(2)}</strong></td>
                  </tr>
                `
                )
                .join('');

        printPdfReport(
          `Profit Distribution Batch #${batchNumber} Breakdown`,
          `
            <p style="font-size:12px;color:#475569;margin-bottom:14px;">
              <strong>Batch ID:</strong> ${record.id} &nbsp;|&nbsp;
              <strong>Executed Date:</strong> ${record.date}
            </p>
            <div class="summary-grid">
              <div class="card"><div class="card-label">Total Pool</div><div class="card-val">$${Number(record.amount || 0).toFixed(2)}</div></div>
              <div class="card"><div class="card-label">Direct Profit</div><div class="card-val">$${Number(record.directProfit || 0).toFixed(2)}</div></div>
              <div class="card"><div class="card-label">Referral Bonus</div><div class="card-val">$${Number(record.referralBonus || 0).toFixed(2)}</div></div>
              <div class="card"><div class="card-label">Investors Credited</div><div class="card-val">${detailsList.length}</div></div>
            </div>
            <h2>Individual Investor Payout Breakdown</h2>
            <table>
              <thead>
                <tr>
                  <th>Investor Name</th>
                  <th>User ID (Phone)</th>
                  <th>Direct Profit</th>
                  <th>Referral Bonus</th>
                  <th>Total Credited</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          `
        );
      };

      return (
        <div className="p-4 sm:p-8 max-w-7xl mx-auto space-y-8">
          <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 p-6 sm:p-8 rounded-3xl border border-indigo-500/20 shadow-2xl space-y-2">
            <h2 className="text-2xl sm:text-3xl font-extrabold text-white">Profit & Referral Distribution</h2>
            <p className="text-slate-400 text-sm">
              Distribute pro-rata trading profits and referral bonuses, or edit/delete/recover past batches.
            </p>
          </div>

          <div className="bg-slate-800/90 p-6 sm:p-8 rounded-3xl border border-slate-700/80 shadow-xl space-y-5">
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div className="sm:col-span-2">
                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">
                  Total Profit Pool Amount ($)
                </label>
                <div className="relative">
                  <span className="absolute left-4 top-3.5 text-indigo-400 font-bold font-mono text-lg">$</span>
                  <input
                    type="number"
                    placeholder="Enter total amount (e.g. 1000)"
                    className="w-full bg-slate-900/90 border border-slate-700 p-3.5 pl-10 rounded-2xl text-white font-mono text-lg outline-none focus:border-indigo-500"
                    value={amount}
                    onChange={(e) => setAmount(e.target.value)}
                  />
                </div>
              </div>
              <div>
                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">
                  Profit Distribution Date
                </label>
                <input
                  type="date"
                  className="w-full bg-slate-900/90 border border-slate-700 p-3.5 rounded-2xl text-white text-base outline-none focus:border-indigo-500"
                  value={distDateInput}
                  onChange={(e) => setDistDateInput(e.target.value)}
                />
              </div>
            </div>

            {distError && <p className="text-xs text-red-400">{distError}</p>}

            <button
              type="button"
              onClick={handleDistribute}
              className="w-full bg-gradient-to-r from-indigo-600 via-blue-600 to-indigo-700 hover:from-indigo-500 hover:to-blue-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-3 text-base sm:text-lg"
            >
              <Check size={22} /> Distribute Profit Now
            </button>
          </div>

          <div className="space-y-4 pt-2">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
              <div className="flex items-center gap-3">
                <h3 className="text-xl font-bold text-white flex items-center gap-2">
                  <History className="text-indigo-400" /> Distribution History
                </h3>
                <span className="px-3 py-1 bg-slate-800 text-slate-300 font-mono text-xs rounded-full border border-slate-700">
                  {filteredBatches.length} Batches
                </span>
              </div>
              <button
                type="button"
                onClick={downloadProfitHistoryPdf}
                className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition-colors"
              >
                <Download size={16} /> Download Profit Report PDF
              </button>
            </div>

            <DateFilterBar
              startDate={filterStartDate}
              endDate={filterEndDate}
              setStartDate={setFilterStartDate}
              setEndDate={setFilterEndDate}
            />

            {filteredBatches.length === 0 ? (
              <div className="bg-slate-800/60 p-10 rounded-2xl border border-slate-700 text-center text-slate-500">
                No distribution batches recorded in the selected date range.
              </div>
            ) : (
              filteredBatches.map((record, i) => {
                const batchNum = filteredBatches.length - i;
                return (
                  <div key={record.id || i} className="bg-slate-800/90 rounded-2xl border border-slate-700 overflow-hidden shadow-xl">
                    {editingBatchId === record.id ? (
                      <div className="p-5 bg-slate-900 space-y-4">
                        <h4 className="font-bold text-blue-400 text-sm">Edit Batch #{batchNum}</h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="text-xs text-slate-400 block mb-1">Total Pool Amount ($)</label>
                            <input
                              type="number"
                              value={editBatchAmount}
                              onChange={(e) => setEditBatchAmount(e.target.value)}
                              className="w-full bg-slate-800 p-2.5 rounded-lg text-white font-mono text-sm border border-slate-700 outline-none"
                            />
                          </div>
                          <div>
                            <label className="text-xs text-slate-400 block mb-1">Distribution Date</label>
                            <input
                              type="date"
                              value={editBatchDate}
                              onChange={(e) => setEditBatchDate(e.target.value)}
                              className="w-full bg-slate-800 p-2.5 rounded-lg text-white text-sm border border-slate-700 outline-none"
                            />
                          </div>
                        </div>
                        <div className="flex gap-2 justify-end">
                          <button
                            type="button"
                            onClick={() => setEditingBatchId(null)}
                            className="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-xs font-semibold text-white"
                          >
                            Cancel
                          </button>
                          <button
                            type="button"
                            onClick={() => handleSaveEditBatch(record)}
                            className="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-lg text-xs font-semibold text-white"
                          >
                            Save Batch
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div className="p-5 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-slate-900/50">
                        <div className="space-y-1">
                          <div className="flex items-center gap-2.5">
                            <span className="bg-indigo-500/20 text-indigo-300 font-mono font-bold text-xs px-2.5 py-0.5 rounded-lg">
                              Batch #{batchNum}
                            </span>
                            <span className="text-xs text-slate-400">{record.date}</span>
                          </div>
                          <div className="text-xl font-extrabold text-white font-mono">
                            Pool: <span className="text-emerald-400">${Number(record.amount).toFixed(2)}</span>
                          </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                          <button
                            type="button"
                            onClick={() => downloadSingleBatchPdf(record, batchNum)}
                            className="bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1"
                            title="Download Batch PDF"
                          >
                            <Download size={14} /> PDF
                          </button>
                          <button
                            type="button"
                            onClick={() => setExpandedBatchId(expandedBatchId === record.id ? null : record.id)}
                            className="bg-slate-700 hover:bg-slate-600 px-3.5 py-2 rounded-lg text-xs font-semibold text-white flex items-center gap-1.5"
                          >
                            <Eye size={14} /> {expandedBatchId === record.id ? 'Hide' : 'Breakdown'}
                          </button>
                          <button
                            type="button"
                            onClick={() => handleStartEditBatch(record)}
                            className="bg-blue-500/20 text-blue-400 hover:bg-blue-500/30 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1"
                          >
                            <Edit size={14} /> Edit
                          </button>
                          <button
                            type="button"
                            onClick={() => handleDeleteBatch(record)}
                            className="bg-red-500/20 text-red-400 hover:bg-red-500/30 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1"
                          >
                            <Trash2 size={14} /> Delete
                          </button>
                        </div>
                      </div>
                    )}

                    {expandedBatchId === record.id && record.details && (
                      <div className="p-5 bg-slate-900/95 border-t border-slate-700/70 overflow-x-auto">
                        <table className="w-full text-left text-sm">
                          <thead className="bg-slate-800 text-slate-400 text-xs uppercase">
                            <tr>
                              <th className="p-3">Investor</th>
                              <th className="p-3">Phone</th>
                              <th className="p-3">Direct Profit</th>
                              <th className="p-3">Referral Bonus</th>
                              <th className="p-3 text-right">Total</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800">
                            {record.details.map((det, idx) => (
                              <tr key={idx}>
                                <td className="p-3 font-bold text-white">{det.name}</td>
                                <td className="p-3 font-mono text-slate-400 text-xs">{det.phone}</td>
                                <td className="p-3 font-mono text-blue-400">${Number(det.directProfit || 0).toFixed(2)}</td>
                                <td className="p-3 font-mono text-purple-400">${Number(det.referralEarned || 0).toFixed(2)}</td>
                                <td className="p-3 font-mono text-emerald-400 font-bold text-right">
                                  ${(Number(det.directProfit || 0) + Number(det.referralEarned || 0)).toFixed(2)}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                );
              })
            )}
          </div>

          {deletedProfitHistory.length > 0 && (
            <div className="bg-slate-800/60 p-6 rounded-2xl border border-red-500/30 space-y-3">
              <h3 className="text-base font-bold text-red-400 flex items-center gap-2">
                <Trash2 size={18} /> Deleted Profit Distributions (Recoverable)
              </h3>
              {deletedProfitHistory.map((item) => (
                <div
                  key={item.record.id}
                  className="bg-slate-900 p-3.5 rounded-xl border border-slate-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3"
                >
                  <div>
                    <p className="font-bold text-white text-sm">
                      Pool: ${Number(item.record.amount).toFixed(2)}{' '}
                      <span className="text-slate-400 font-normal text-xs">({item.record.date})</span>
                    </p>
                    <p className="text-xs text-slate-500">{item.record.count} Investors affected</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => handleRecoverBatch(item)}
                    className="bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5"
                  >
                    <RotateCcw size={14} /> Recover Batch
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // --- ADMIN SETTINGS ---
    const AdminSettings = ({
      adminWalletAddress,
      setAdminWalletAddress,
      adminQrImage,
      setAdminQrImage
    }) => {
      const [tempAddress, setTempAddress] = useState(adminWalletAddress);
      const [tempImage, setTempImage] = useState(adminQrImage);
      const [statusMsg, setStatusMsg] = useState('');

      const handleSaveSettings = () => {
        setStatusMsg('');
        if (!tempAddress.trim().startsWith('0x') || tempAddress.trim().length < 42) {
          setStatusMsg('Invalid BEP20 address format (must start with 0x and be at least 42 characters).');
          return;
        }
        setAdminWalletAddress(tempAddress.trim());
        setAdminQrImage(tempImage);
        setStatusMsg('Deposit settings saved.');
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setTempImage(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      return (
        <div className="p-4 sm:p-6 max-w-6xl mx-auto space-y-6">
          <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
            <h3 className="text-lg font-bold mb-2">Global Deposit Address & QR / Screenshot</h3>
            <p className="text-slate-400 text-sm mb-4">
              Set the BEP20 wallet address and upload a QR code or payment screenshot for investors to see when making a deposit.
