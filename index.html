    // --- INVESTOR DEPOSIT ---
    const InvestorDeposit = ({ currentUser, adminWalletAddress, adminQrImage, transactions, setTransactions, setActiveTab }) => {
      const [hash, setHash] = useState('');
      const [isVerifying, setIsVerifying] = useState(false);
      const [verifiedAmount, setVerifiedAmount] = useState(null);
      const [screenshot, setScreenshot] = useState('');
      const [depError, setDepError] = useState('');
      const [viewingQr, setViewingQr] = useState(false);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setScreenshot(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const verifyHash = () => {
        setDepError('');
        if (!hash.trim()) {
          setDepError('Please enter a Transaction Hash.');
          return;
        }

        setIsVerifying(true);
        setTimeout(() => {
          const isDuplicate = transactions.find((t) => t.hash === hash.trim() && t.type === 'Deposit');
          if (isDuplicate) {
            setIsVerifying(false);
            setDepError('This Transaction Hash has already been used for a deposit.');
            return;
          }
          const simAmount = Math.floor(Math.random() * (5000 - 100 + 1) + 100);
          setVerifiedAmount(simAmount);
          setIsVerifying(false);
        }, 1000);
      };

      const handleDeposit = () => {
        setDepError('');
        if (!verifiedAmount) {
          setDepError('Please verify your transaction hash first.');
          return;
        }

        const val = Number(verifiedAmount);
        if (val < 100 || val > 100000) {
          setDepError('Amount must be between $100 and $100,000.');
          return;
        }

        setTransactions([
          ...transactions,
          {
            id: Date.now(),
            userId: currentUser.phone,
            type: 'Deposit',
            amount: val,
            status: 'Pending',
            date: new Date().toLocaleString(),
            hash: hash.trim(),
            screenshot
          }
        ]);
        setHash('');
        setVerifiedAmount(null);
        setScreenshot('');
        setActiveTab('history');
      };

      return (
        <div className="p-4 sm:p-6 max-w-2xl mx-auto space-y-6">
          <h2 className="text-2xl font-bold mb-6">Make a Deposit</h2>
          <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-6">
            <div className="bg-slate-900 p-4 rounded-lg border border-slate-700 space-y-4">
              <p className="text-sm text-slate-400">Send BEP20 USDT to:</p>
              <div className="flex items-center justify-between bg-slate-800 p-3 rounded border border-slate-600">
                <code className="text-green-400 text-sm sm:text-base break-all pr-2">{adminWalletAddress}</code>
                <button
                  type="button"
                  onClick={() => copyTextToClipboard(adminWalletAddress)}
                  className="p-2 hover:bg-slate-700 rounded transition-colors"
                >
                  <Copy size={18} />
                </button>
              </div>

              {adminQrImage && (
                <div className="pt-2 border-t border-slate-800 text-center">
                  <p className="text-xs text-slate-400 mb-2">Scan QR / Payment QR Code:</p>
                  <div
                    className="inline-block bg-slate-800 p-2 rounded-lg border border-slate-700 cursor-pointer hover:opacity-90 transition-opacity"
                    onClick={() => setViewingQr(true)}
                  >
                    <img src={adminQrImage} alt="Deposit QR" className="w-36 h-36 object-contain mx-auto rounded" />
                    <span className="text-xs text-blue-400 mt-1 block">Click to Enlarge</span>
                  </div>
                </div>
              )}
            </div>

            <div className="space-y-4">
              <div>
                <label className="text-sm text-slate-400 block mb-2">Enter Transaction Hash (TxID) after sending</label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    placeholder="0x..."
                    className="flex-1 bg-slate-700 p-3 rounded-lg outline-none focus:ring-1 focus:ring-blue-500 font-mono text-sm text-white"
                    value={hash}
                    onChange={(e) => {
                      setHash(e.target.value);
                      setVerifiedAmount(null);
                      setDepError('');
                    }}
                    disabled={isVerifying}
                  />
                  <button
                    type="button"
                    onClick={verifyHash}
                    disabled={isVerifying}
                    className="bg-blue-600 hover:bg-blue-700 px-4 rounded-lg font-semibold transition-colors disabled:opacity-50 text-white"
                  >
                    {isVerifying ? 'Checking...' : 'Verify'}
                  </button>
                </div>
              </div>

              <div>
                <label className="text-sm text-slate-400 block mb-2">Upload Payment Screenshot (Optional)</label>
                <input
                  type="file"
                  accept="image/*"
                  onChange={handleImageUpload}
                  className="w-full bg-slate-700 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer text-slate-300"
                />
                {screenshot && (
                  <div className="mt-2 inline-block">
                    <img src={screenshot} alt="Preview" className="w-20 h-20 object-cover rounded border border-slate-600" />
                  </div>
                )}
              </div>

              {verifiedAmount && (
                <div className="bg-green-500/10 border border-green-500/30 p-4 rounded-lg flex justify-between items-center">
                  <div>
                    <p className="text-green-400 text-sm font-bold">Verified Amount Found</p>
                    <p className="text-xs text-slate-400">Destination: Admin Wallet (Match)</p>
                  </div>
                  <p className="text-2xl font-bold text-white">${verifiedAmount}</p>
                </div>
              )}

              {depError && <p className="text-xs text-red-400">{depError}</p>}

              <button
                type="button"
                onClick={handleDeposit}
                disabled={!verifiedAmount}
                className="w-full bg-green-600 hover:bg-green-700 disabled:bg-slate-700 disabled:text-slate-500 p-4 rounded-lg font-bold text-lg transition-colors mt-4 shadow-lg text-white"
              >
                Submit Deposit
              </button>
            </div>
          </div>

          {viewingQr && (
            <div
              className="fixed inset-0 bg-slate-900/95 backdrop-blur-md flex items-center justify-center p-4 z-50"
              onClick={() => setViewingQr(false)}
            >
              <div
                className="bg-slate-800 p-4 rounded-2xl border border-slate-700 max-w-sm w-full text-center relative"
                onClick={(e) => e.stopPropagation()}
              >
                <button
                  type="button"
                  onClick={() => setViewingQr(false)}
                  className="absolute top-3 right-3 text-slate-400 hover:text-white bg-slate-700/50 p-2 rounded-full"
                >
                  <X size={20} />
                </button>
                <h3 className="text-lg font-bold mb-3 text-white">Deposit QR / Screenshot</h3>
                <img
                  src={adminQrImage}
                  alt="Deposit QR Zoom"
                  className="w-full h-auto max-h-[70vh] object-contain rounded-lg mx-auto bg-slate-900 p-2"
                />
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- INVESTOR WITHDRAW ---
    const InvestorWithdraw = ({ currentUser, transactions, setTransactions, setActiveTab }) => {
      const [amount, setAmount] = useState('');
      const [address, setAddress] = useState('');
      const [withError, setWithError] = useState('');

      const userPendingW = transactions
        .filter((t) => t.userId === currentUser.phone && t.type === 'Withdrawal' && t.status === 'Pending')
        .reduce((sum, w) => sum + Number(w.amount), 0);
      const availableBal = (Number(currentUser.balance) || 0) - userPendingW;

      const handleWithdraw = () => {
        setWithError('');
        const val = Number(amount);
        if (!val || val <= 0) {
          setWithError('Please enter a valid amount.');
          return;
        }
        if (val > availableBal) {
          setWithError('Insufficient available balance.');
          return;
        }
        if (currentUser.tradingActive) {
          setWithError('Please turn OFF trading on your Dashboard before withdrawing.');
          return;
        }
        if (!address.trim().startsWith('0x') || address.trim().length < 42) {
          setWithError('Please enter a valid BEP20 (0x...) wallet address.');
          return;
        }

        setTransactions([
          ...transactions,
          {
            id: Date.now(),
            userId: currentUser.phone,
            type: 'Withdrawal',
            amount: val,
            status: 'Pending',
            date: new Date().toLocaleString(),
            address: address.trim()
          }
        ]);
        setAmount('');
        setAddress('');
        setActiveTab('history');
      };

      return (
        <div className="p-4 sm:p-6 max-w-2xl mx-auto space-y-6">
          <h2 className="text-2xl font-bold mb-6">Withdraw Funds</h2>
          <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
            <div className="flex justify-between items-center bg-slate-900 p-4 rounded-lg border border-slate-700 mb-4">
              <span className="text-slate-400">Available to Withdraw:</span>
              <span className="text-xl font-bold text-green-400">${availableBal.toFixed(2)}</span>
            </div>
            <input
              type="number"
              placeholder="Amount (USD)"
              className="w-full bg-slate-700 p-3 rounded-lg outline-none focus:ring-1 focus:ring-blue-500 text-white"
              value={amount}
              onChange={(e) => setAmount(e.target.value)}
            />
            <input
              type="text"
              placeholder="Your BEP20 Address (0x...)"
              className="w-full bg-slate-700 p-3 rounded-lg outline-none focus:ring-1 focus:ring-blue-500 font-mono text-sm text-white"
              value={address}
              onChange={(e) => setAddress(e.target.value)}
            />
            {withError && <p className="text-xs text-red-400">{withError}</p>}
            <p className="text-xs text-orange-400">
              Ensure this is a valid BEP20 (BSC) address. Assets sent to wrong addresses cannot be recovered.
            </p>
            <button
              type="button"
              onClick={handleWithdraw}
              className="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-lg font-bold text-lg transition-colors mt-2 text-white"
            >
              Request Withdrawal
            </button>
          </div>
        </div>
      );
    };

    // --- INVESTOR TEAM (REFERRALS) ---
    const InvestorTeam = ({ currentUser, users, setUsers, transactions }) => {
      const [newDownline, setNewDownline] = useState('');
      const [teamMsg, setTeamMsg] = useState('');
      const [selectedLevel, setSelectedLevel] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      const level1Team = users.filter((u) => u.referrer === currentUser.phone);
      const level1Phones = level1Team.map((u) => u.phone);

      const level2Team = users.filter((u) => u.referrer && level1Phones.includes(u.referrer));
      const level2Phones = level2Team.map((u) => u.phone);

      const level3Team = users.filter((u) => u.referrer && level2Phones.includes(u.referrer));

      const completedMyTxns = transactions.filter(
        (t) => t.userId === currentUser.phone && t.status === 'Completed'
      );

      const getMemberCommissionEarned = (memberName, levelTag) => {
        return completedMyTxns
          .filter((t) => t.type === `Referral Bonus (${levelTag} from ${memberName})`)
          .reduce((sum, t) => sum + Number(t.amount), 0);
      };

      const getMemberTotalDeposited = (memberPhone) => {
        return transactions
          .filter((t) => t.userId === memberPhone && t.type === 'Deposit' && t.status === 'Completed')
          .reduce((sum, t) => sum + Number(t.amount), 0);
      };

      const enrichMember = (member, levelNum) => {
        const levelTag = `L${levelNum}`;
        const sponsor = users.find((u) => u.phone === member.referrer);
        const pendingW = transactions
          .filter((t) => t.userId === member.phone && t.type === 'Withdrawal' && t.status === 'Pending')
          .reduce((sum, w) => sum + Number(w.amount), 0);
        const activeCapital = member.tradingActive ? Math.max(0, Number(member.balance || 0) - pendingW) : 0;

        return {
          ...member,
          levelNum,
          levelLabel: levelNum === 1 ? '1st Level' : levelNum === 2 ? '2nd Level' : '3rd Level',
          sponsorName: sponsor ? sponsor.name : '-',
          sponsorPhone: sponsor ? sponsor.phone : '-',
          activeCapital,
          totalDeposited: getMemberTotalDeposited(member.phone),
          commissionEarned: getMemberCommissionEarned(member.name, levelTag)
        };
      };

      const allEnrichedMembers = [
        ...level1Team.map((m) => enrichMember(m, 1)),
        ...level2Team.map((m) => enrichMember(m, 2)),
        ...level3Team.map((m) => enrichMember(m, 3))
      ];

      const totalTeamMembers = allEnrichedMembers.length;
      const totalActiveMembers = allEnrichedMembers.filter((m) => m.tradingActive).length;
      const totalTeamTradingCapital = allEnrichedMembers.reduce((sum, m) => sum + m.activeCapital, 0);

      const level1BonusTotal = completedMyTxns
        .filter((t) => t.type.includes('Referral Bonus (L1'))
        .reduce((sum, t) => sum + Number(t.amount), 0);
      const level2BonusTotal = completedMyTxns
        .filter((t) => t.type.includes('Referral Bonus (L2'))
        .reduce((sum, t) => sum + Number(t.amount), 0);
      const level3BonusTotal = completedMyTxns
        .filter((t) => t.type.includes('Referral Bonus (L3'))
        .reduce((sum, t) => sum + Number(t.amount), 0);
      const totalReferralEarned = level1BonusTotal + level2BonusTotal + level3BonusTotal;

      const filteredMembers = allEnrichedMembers.filter((m) => {
        const matchesLevel =
          selectedLevel === 'ALL' ||
          (selectedLevel === 'L1' && m.levelNum === 1) ||
          (selectedLevel === 'L2' && m.levelNum === 2) ||
          (selectedLevel === 'L3' && m.levelNum === 3);

        const q = searchQuery.trim().toLowerCase();
        const matchesQuery =
          !q ||
          m.name.toLowerCase().includes(q) ||
          m.phone.toLowerCase().includes(q) ||
          m.sponsorName.toLowerCase().includes(q);

        return matchesLevel && matchesQuery;
      });

      const addDownline = () => {
        setTeamMsg('');
        if (!newDownline.trim()) {
          setTeamMsg('Please enter a phone number.');
          return;
        }
        const exists = users.find((u) => u.phone === newDownline.trim());
        if (!exists) {
          setTeamMsg('User not found. Ask them to register first.');
          return;
        }
        if (exists.role === 'admin') {
          setTeamMsg('Cannot add system admin to team.');
          return;
        }
        if (exists.referrer) {
          setTeamMsg('This user already has a sponsor.');
          return;
        }
        if (exists.phone === currentUser.phone) {
          setTeamMsg('You cannot refer yourself.');
          return;
        }

        const updated = users.map((u) =>
          u.phone === exists.phone ? { ...u, referrer: currentUser.phone } : u
        );
        setUsers(updated);
        setNewDownline('');
      };

      return (
        <div className="p-4 sm:p-6 max-w-5xl mx-auto space-y-6">
          <div className="bg-gradient-to-r from-indigo-950 via-slate-800 to-slate-800 p-5 sm:p-6 rounded-2xl border border-indigo-500/30 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-bold flex items-center gap-2.5 text-white">
                <Network className="text-indigo-400" /> My Referral Network
              </h2>
              <p className="text-xs sm:text-sm text-slate-400 mt-1">
                Detailed 3-level downline overview, active trading capital, and commission earnings.
              </p>
            </div>
            <div className="bg-slate-900/90 px-4 py-3 rounded-xl border border-slate-700 flex items-center justify-between sm:justify-end gap-3">
              <div>
                <span className="block text-[10px] uppercase tracking-wider text-slate-400 font-semibold">My Sponsor ID</span>
                <span className="font-mono font-bold text-indigo-400 text-sm">{currentUser.phone}</span>
              </div>
              <button
                type="button"
                onClick={() => copyTextToClipboard(currentUser.phone)}
                className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition-colors"
                title="Copy Sponsor ID"
              >
                <Copy size={16} />
              </button>
            </div>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-1">
              <p className="text-xs text-slate-400">Total Team Members</p>
              <p className="text-2xl font-extrabold text-white">{totalTeamMembers}</p>
              <p className="text-[11px] text-emerald-400">{totalActiveMembers} Active Traders</p>
            </div>

            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-1">
              <p className="text-xs text-slate-400">Team Active Capital</p>
              <p className="text-2xl font-extrabold font-mono text-blue-400">${totalTeamTradingCapital.toFixed(2)}</p>
              <p className="text-[11px] text-slate-400">Across all 3 levels</p>
            </div>

            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-1">
              <p className="text-xs text-slate-400">Total Referral Earned</p>
              <p className="text-2xl font-extrabold font-mono text-purple-400">${totalReferralEarned.toFixed(2)}</p>
              <p className="text-[11px] text-slate-400">All-time bonus credited</p>
            </div>

            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-1">
              <p className="text-xs text-slate-400">Commission Structure</p>
              <p className="text-sm font-bold text-white pt-1">L1: 5% &bull; L2: 3% &bull; L3: 2%</p>
              <p className="text-[11px] text-slate-400">Share of pool profit</p>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div
              onClick={() => setSelectedLevel(selectedLevel === 'L1' ? 'ALL' : 'L1')}
              className={`cursor-pointer p-5 rounded-2xl border transition-all ${
                selectedLevel === 'L1'
                  ? 'bg-blue-950/50 border-blue-500 shadow-lg'
                  : 'bg-slate-800 border-slate-700 hover:border-slate-600'
              }`}
            >
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-bold uppercase tracking-wider text-blue-400">1st Level (Direct)</span>
                <span className="px-2 py-0.5 rounded-full text-[11px] bg-blue-500/20 text-blue-300 font-semibold">
                  {level1Team.filter((m) => m.tradingActive).length}/{level1Team.length} Active
                </span>
              </div>
              <div className="flex justify-between items-end mt-3">
                <div>
                  <p className="text-xs text-slate-400">Members</p>
                  <p className="text-2xl font-extrabold text-white">{level1Team.length}</p>
                </div>
                <div className="text-right">
                  <p className="text-xs text-slate-400">Earned</p>
                  <p className="text-lg font-bold font-mono text-emerald-400">${level1BonusTotal.toFixed(2)}</p>
                </div>
              </div>
            </div>

            <div
              onClick={() => setSelectedLevel(selectedLevel === 'L2' ? 'ALL' : 'L2')}
              className={`cursor-pointer p-5 rounded-2xl border transition-all ${
                selectedLevel === 'L2'
                  ? 'bg-indigo-950/50 border-indigo-500 shadow-lg'
                  : 'bg-slate-800 border-slate-700 hover:border-slate-600'
              }`}
            >
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-bold uppercase tracking-wider text-indigo-400">2nd Level</span>
                <span className="px-2 py-0.5 rounded-full text-[11px] bg-indigo-500/20 text-indigo-300 font-semibold">
                  {level2Team.filter((m) => m.tradingActive).length}/{level2Team.length} Active
                </span>
              </div>
              <div className="flex justify-between items-end mt-3">
                <div>
                  <p className="text-xs text-slate-400">Members</p>
                  <p className="text-2xl font-extrabold text-white">{level2Team.length}</p>
                </div>
                <div className="text-right">
                  <p className="text-xs text-slate-400">Earned</p>
                  <p className="text-lg font-bold font-mono text-emerald-400">${level2BonusTotal.toFixed(2)}</p>
                </div>
              </div>
            </div>

            <div
              onClick={() => setSelectedLevel(selectedLevel === 'L3' ? 'ALL' : 'L3')}
              className={`cursor-pointer p-5 rounded-2xl border transition-all ${
                selectedLevel === 'L3'
                  ? 'bg-cyan-950/50 border-cyan-500 shadow-lg'
                  : 'bg-slate-800 border-slate-700 hover:border-slate-600'
              }`}
            >
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-bold uppercase tracking-wider text-cyan-400">3rd Level</span>
                <span className="px-2 py-0.5 rounded-full text-[11px] bg-cyan-500/20 text-cyan-300 font-semibold">
                  {level3Team.filter((m) => m.tradingActive).length}/{level3Team.length} Active
                </span>
              </div>
              <div className="flex justify-between items-end mt-3">
                <div>
                  <p className="text-xs text-slate-400">Members</p>
                  <p className="text-2xl font-extrabold text-white">{level3Team.length}</p>
                </div>
                <div className="text-right">
                  <p className="text-xs text-slate-400">Earned</p>
                  <p className="text-lg font-bold font-mono text-emerald-400">${level3BonusTotal.toFixed(2)}</p>
                </div>
              </div>
            </div>
          </div>

          <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-3">
            <h3 className="text-base font-bold text-white">Connect New Direct Member (1st Level)</h3>
            <p className="text-xs text-slate-400">
              Ask your friend to create an account first, then enter their registered Phone Number below to add them to your 1st level.
            </p>
            <div className="flex flex-col sm:flex-row gap-3">
              <input
                type="text"
                placeholder="Enter Member Phone Number"
                className="flex-1 bg-slate-900 border border-slate-700 p-3 rounded-xl outline-none focus:border-blue-500 text-white text-sm"
                value={newDownline}
                onChange={(e) => setNewDownline(e.target.value)}
              />
              <button
                type="button"
                onClick={addDownline}
                className="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-xl font-semibold text-sm text-white transition-colors"
              >
                Connect Member
              </button>
            </div>
            {teamMsg && <p className="text-xs text-orange-400">{teamMsg}</p>}
          </div>

          <div className="space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div className="flex flex-wrap gap-2">
                {[
                  { id: 'ALL', label: `All Levels (${totalTeamMembers})` },
                  { id: 'L1', label: `1st Level (${level1Team.length})` },
                  { id: 'L2', label: `2nd Level (${level2Team.length})` },
                  { id: 'L3', label: `3rd Level (${level3Team.length})` }
                ].map((tab) => (
                  <button
                    key={tab.id}
                    type="button"
                    onClick={() => setSelectedLevel(tab.id)}
                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-colors ${
                      selectedLevel === tab.id
                        ? 'bg-blue-600 text-white'
                        : 'bg-slate-800 text-slate-400 hover:text-white border border-slate-700'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              <input
                type="text"
                placeholder="Search name, phone, or sponsor..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="bg-slate-800 border border-slate-700 px-3.5 py-2 rounded-xl text-xs text-white outline-none focus:border-blue-500 w-full sm:w-64"
              />
            </div>

            <div className="block md:hidden space-y-3">
              {filteredMembers.length === 0 ? (
                <div className="bg-slate-800 p-8 rounded-2xl border border-slate-700 text-center text-slate-500 text-sm">
                  No team members found in this level.
                </div>
              ) : (
                filteredMembers.map((member) => (
                  <div key={member.phone} className="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                    <div className="flex justify-between items-start border-b border-slate-700 pb-2.5">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-white text-base">{member.name}</span>
                          <span
                            className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                              member.levelNum === 1
                                ? 'bg-blue-500/20 text-blue-300'
                                : member.levelNum === 2
                                ? 'bg-indigo-500/20 text-indigo-300'
                                : 'bg-cyan-500/20 text-cyan-300'
                            }`}
                          >
                            {member.levelLabel}
                          </span>
                        </div>
                        <p className="text-xs font-mono text-slate-400 mt-0.5">ID: {member.phone}</p>
                      </div>
                      <span
                        className={`px-2.5 py-1 rounded-full text-[11px] font-bold ${
                          member.tradingActive ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700 text-slate-400'
                        }`}
                      >
                        {member.tradingActive ? 'Trading ON' : 'Trading OFF'}
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div className="bg-slate-900/70 p-2.5 rounded-lg">
                        <span className="text-slate-400 block">Joined Date</span>
                        <span className="text-white font-semibold">{formatDateInputForDisplay(member.joinedDate)}</span>
                      </div>
                      <div className="bg-slate-900/70 p-2.5 rounded-lg">
                        <span className="text-slate-400 block">Referred By</span>
                        <span className="text-white font-semibold">{member.sponsorName}</span>
                      </div>
                      <div className="bg-slate-900/70 p-2.5 rounded-lg">
                        <span className="text-slate-400 block">Active Trading Bal</span>
                        <span className="text-blue-400 font-mono font-bold">${member.activeCapital.toFixed(2)}</span>
                      </div>
                      <div className="bg-slate-900/70 p-2.5 rounded-lg">
                        <span className="text-slate-400 block">My Bonus Earned</span>

            <div className="hidden md:block bg-slate-800 rounded-2xl border border-slate-700 overflow-x-auto">
              <table className="w-full text-left text-sm">
                <thead className="bg-slate-900/60 text-slate-400 text-xs uppercase tracking-wider">
                  <tr>
                    <th className="p-4">Member</th>

    // --- INVESTOR TRANSACTION HISTORY ---
    const UserHistory = ({ currentUser, transactions }) => {
      const [filterStartDate, setFilterStartDate] = useState('');
      const [filterEndDate, setFilterEndDate] = useState('');

      const userTxns = transactions.filter(
        (t) => t.userId === currentUser.phone && isWithinDateRange(t.date, filterStartDate, filterEndDate)
      );

      return (
        <div className="p-4 sm:p-6 max-w-4xl mx-auto space-y-6">
          <h2 className="text-2xl font-bold">Transaction History</h2>

          <DateFilterBar
            startDate={filterStartDate}
            endDate={filterEndDate}
            setStartDate={setFilterStartDate}
            setEndDate={setFilterEndDate}
          />

          <div className="block sm:hidden space-y-4">
            {userTxns.length === 0 ? (
              <p className="text-slate-500">No transactions found.</p>
            ) : (
              userTxns
                .slice()
                .reverse()
                .map((t, i) => (
                  <div key={i} className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">
                    <div className="flex justify-between items-center">
                      <span
                        className={`font-bold ${
                          t.type.includes('Profit') || t.type.includes('Bonus')
                            ? 'text-green-400'
                            : t.type === 'Withdrawal'
                            ? 'text-orange-400'
                            : 'text-blue-400'
                        }`}
                      >
                        {t.type}
                      </span>
                      <span className="font-bold text-white">${Number(t.amount).toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between items-center text-sm">
                      <span className="text-slate-400 text-xs">{t.date}</span>
                      <span
                        className={`px-2 py-1 rounded text-xs ${
                          t.status === 'Completed'
                            ? 'bg-green-500/20 text-green-400'
                            : t.status === 'Pending'
                            ? 'bg-orange-500/20 text-orange-400'
                            : 'bg-red-500/20 text-red-400'
                        }`}
                      >
                        {t.status}
                      </span>
                    </div>
                  </div>
                ))
            )}
          </div>

          <div className="hidden sm:block bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <table className="w-full text-left">
              <thead className="bg-slate-900/50">
                <tr>
                  <th className="p-4">Date & Time</th>
                  <th className="p-4">Type</th>
                  <th className="p-4">Amount</th>
                  <th className="p-4">Status</th>
                </tr>
              </thead>
              <tbody>
                {userTxns.length === 0 ? (
                  <tr>
                    <td colSpan="4" className="p-4 text-center text-slate-500">
                      No transactions yet
                    </td>
                  </tr>
                ) : (
                  userTxns
                    .slice()
                    .reverse()
                    .map((t, i) => (
                      <tr key={i} className="border-t border-slate-700">
                        <td className="p-4 text-sm text-slate-300">{t.date}</td>
                        <td
                          className={`p-4 ${
                            t.type.includes('Profit') || t.type.includes('Bonus')
                              ? 'text-green-400'
                              : t.type === 'Withdrawal'
                              ? 'text-orange-400'
                              : 'text-blue-400'
                          }`}
                        >
                          {t.type}
                        </td>
                        <td className="p-4 font-mono font-bold">${Number(t.amount).toFixed(2)}</td>
                        <td className="p-4">
                          <span
                            className={`px-2 py-1 rounded text-xs ${
                              t.status === 'Completed'
                                ? 'bg-green-500/20 text-green-400'
                                : t.status === 'Pending'
                                ? 'bg-orange-500/20 text-orange-400'
                                : 'bg-red-500/20 text-red-400'
                            }`}
                          >
                            {t.status}
                          </span>
                        </td>
                      </tr>
                    ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    };
